  - short_name: boldistilled
    # The endpoint always serves the current release; the converter resolves the
    # release month from the extracted filenames and records it next to the output
    # FASTA as <output>.version. Do not pin a version here — it would go stale silently.
    version: rolling
    target_gene: COI
    taxonomic_scope: Animals (COI barcode, BOLD BIN clusters)
    citation: >
      BOLDistilled: a curated and deduplicated reference database derived from
      BOLD Systems. https://www.boldsystems.org
    endpoints:
      - https://us-sea-1.linodeobjects.com/boldistilled/source.zip
    # No prepare_sentinel: a sentinel naming one release would skip extraction of a
    # newer zip. unzip -n is cheap and never overwrites, so just always run it.
    prepare_cmd: unzip -n source-data/boldistilled/source.zip -d source-data/boldistilled/
    convert_cmd: python3 converters/boldistilled_to_fasta.py source-data/boldistilled/source boldistilled_coi --target-gene COI

